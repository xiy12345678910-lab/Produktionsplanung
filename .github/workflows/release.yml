# Releases only via a manual run on main: the workflow builds and checks the package and creates a DRAFT.
# Jonas publishes the draft on GitHub; publishing creates the tag vX.Y.Z. No tag pushes, no hand-made releases.
name: Release package
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require main and passing CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Releases must be built on main');
            await exec.exec('git', ['merge-base', '--is-ancestor', context.sha, 'origin/main']);
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, head_sha: context.sha, status: 'completed', per_page: 100 });
            if (!data.workflow_runs.some(r => r.name === 'CI' && r.event === 'push' && r.head_branch === 'main' && r.conclusion === 'success' && r.head_sha === context.sha)) throw new Error('Main CI must pass for the exact release commit');
      - run: python tests/test_version.py
      - name: Build and check assets
        run: python tools/build_release.py --output /tmp/release --notes /tmp/release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("/tmp/release/update-manifest.json"))["version"])')
          if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version exists already"; exit 1; fi
          gh release create "v$version" /tmp/release/* --draft --target "$GITHUB_SHA" --title "Produktionsplanung v$version" --notes-file /tmp/release-notes.md
