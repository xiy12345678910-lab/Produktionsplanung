# Maintainers publish the draft only after reviewing notes and completed CI.
name: Release package
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require main and passing CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Releases must be built on main');
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, head_sha: context.sha, status: 'completed', per_page: 100 });
            if (!data.workflow_runs.some(r => r.name === 'CI' && r.conclusion === 'success' && r.head_sha === context.sha)) throw new Error('CI must pass for the release commit');
      - run: python tests/test_version.py
      - run: python tools/build_release.py --output /tmp/release
      - name: Create draft release with checked assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("/tmp/release/update-manifest.json"))["version"])')
          gh release create "v$version" /tmp/release/* --target "$GITHUB_SHA" --draft --title "Produktionsplanung v$version" --notes-file RELEASE_NOTES.txt
