# CI: Python-Tests, Browser-E2E (Playwright/Chromium) und PowerShell-Pruefung.
# Releases (Tag vX.Y.Z) nur anlegen, wenn dieser Lauf auf main gruen ist.
name: CI

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile server.py release_gates.py Backup_Datenbank.py
      - name: Version einheitlich
        run: python tests/test_version.py
      - name: Server-Regeln
        run: |
          python tests/test_v128.py
          python tests/test_v129.py
          python tests/test_notifications.py
          python tests/test_v12102.py
      - name: Backup/Restore
        run: python tests/test_backup.py
      - name: Regression (kuenstliche DB)
        run: |
          d=$(mktemp -d)
          python tests/make_test_db.py "$d"
          python tests/test_regression.py "$d"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: UI-Smoke
        run: node tests/ui_smoke.mjs
      - name: E2E
        run: |
          for f in tests/e2e_*.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax aller Skripte
        shell: pwsh
        run: ./tests/ps_syntax.ps1
      - name: PSScriptAnalyzer (Fehler)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
