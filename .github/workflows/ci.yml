# CI: Python-Tests, Browser-E2E (Playwright/Chromium) und PowerShell-Pruefung.
# Releases (Tag vX.Y.Z) nur anlegen, wenn dieser Lauf auf main gruen ist.
name: CI

on:
  push:
    branches: ['main', 'claude/**', 'codex/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tests/test_deploy_upgrade.py holt alte Staende per git archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile server.py release_gates.py app_updates.py Backup_Datenbank.py
      - name: Version einheitlich
        run: python tests/test_version.py
      - name: Server-Regeln
        run: |
          python tests/test_v128.py
          python tests/test_v129.py
          python tests/test_notifications.py
          python tests/test_v12102.py
          python tests/test_client_abort.py
          python tests/test_firma_config.py
          python tests/test_config_update.py
          python tests/test_config_api.py
          python tests/test_no_employer_data.py
          python tests/test_templates.py
          python tests/test_effort.py
          python tests/test_setup.py
          python tests/test_blocks.py
          python tests/test_updates.py
          python tests/test_av_handoff.py
          python tests/test_project_live.py
          python tests/test_personnel_times.py
          python tests/test_admin_v12191.py
          python tests/test_tls.py
          python tests/test_demand.py
      - name: Backup/Restore
        run: python tests/test_backup.py
      - name: Datenerhalt bei Updates (alte Staende -> aktuell)
        env:
          MP_UPGRADE_STRICT: '1'
        run: python tests/test_deploy_upgrade.py
      - name: Regression (kuenstliche DB)
        run: |
          d=$(mktemp -d)
          python tests/make_test_db.py "$d"
          python tests/test_regression.py "$d"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: UI-Smoke
        run: node tests/ui_smoke.mjs
      - name: E2E
        run: |
          for f in tests/e2e_*.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Syntax aller Skripte
        shell: pwsh
        run: ./tests/ps_syntax.ps1
      - name: ACL-Pruefung (Bits und echte ACLs)
        shell: pwsh
        run: ./tests/ps_acl.ps1
      - name: PSScriptAnalyzer (Fehler)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  # Echtes Deploy: alter Stand wird mit seinem Setup installiert, Daten per API angelegt, dann UPDATE_LIVE.ps1 des aktuellen Stands.
  windows-deploy:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { old: dac0860, scenario: ci }
          - { old: dac0860, scenario: noci }
          - { old: 5343676, scenario: ci }
          - { old: 5343676, scenario: noci }   # V12.10.1 ohne Firmenwerte = Live-Stand des Betriebs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy-Test (${{ matrix.old }}, ${{ matrix.scenario }})
        shell: pwsh
        run: ./tests/ci_windows_deploy.ps1 -OldCommit ${{ matrix.old }} -Scenario ${{ matrix.scenario }}
      - name: Logs bei Fehler
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\mpdeploy\*.log" -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
          Get-ChildItem "$env:ProgramData\Maschinenplanung\logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { "=== $($_.Name)"; Get-Content $_.FullName -Tail 60 }
